name: Build ESignJr-no-pc (Separate Commits)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git identity
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Create storage folder
      run: |
        mkdir -p storage
        git add storage
        git commit -m "Create storage folder"

    - name: Write index.htm
      run: |
        cat > index.htm << 'EOF'
        <!-- INDEX.HTM CONTENT -->
        EOF
        git add index.htm
        git commit -m "Add index.htm"

    - name: Write style.css
      run: |
        cat > style.css << 'EOF'
        /* STYLE.CSS CONTENT */
        EOF
        git add style.css
        git commit -m "Add style.css"

    - name: Write app.js
      run: |
        cat > app.js << 'EOF'
        // APP.JS CONTENT
        EOF
        git add app.js
        git commit -m "Add app.js"

    - name: Write server.js
      run: |
        cat > server.js << 'EOF'
        // SERVER.JS CONTENT
        EOF
        git add server.js
        git commit -m "Add server.js"

    - name: Write sign_backend.py
      run: |
        cat > sign_backend.py << 'EOF'
        # SIGN_BACKEND.PY CONTENT
        EOF
        git add sign_backend.py
        git commit -m "Add sign_backend.py"

    - name: Push all commits
      run: |
        git push
