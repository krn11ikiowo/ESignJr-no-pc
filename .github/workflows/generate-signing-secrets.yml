name: Generate iOS Signing Secrets

on:
  workflow_dispatch:
    inputs:
      cert_pem:
        description: "Upload your Apple Development .pem certificate"
        required: true
        type: string
      key_pem:
        description: "Upload your private .key file"
        required: true
        type: string
      mobileprovision:
        description: "Upload your development .mobileprovision"
        required: true
        type: string
      p12_password:
        description: "Password for generated .p12"
        required: true
        type: string

jobs:
  generate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write uploaded files
        run: |
          mkdir input
          echo "${{ github.event.inputs.cert_pem }}" > input/cert.pem
          echo "${{ github.event.inputs.key_pem }}" > input/key.pem
          echo "${{ github.event.inputs.mobileprovision }}" > input/dev.mobileprovision

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate secrets + signing assets
        run: |
          python build_signing_assets.py \
            --cert input/cert.pem \
            --key input/key.pem \
            --mobileprovision input/dev.mobileprovision \
            --p12-password "${{ github.event.inputs.p12_password }}" \
            --out signing_output

      - name: Upload signing assets
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-assets
          path: signing_output
